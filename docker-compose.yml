services:

  postgres:
    image: postgres:17-alpine
    container_name: mariadiezma_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mariadiezma
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/000001_init_schema.up.sql:/docker-entrypoint-initdb.d/000001_init_schema.sql
      - ./migrations/000002_seed_data.sql:/docker-entrypoint-initdb.d/000002_seed_data.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mariadiezma"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mariadiezma_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      PORT: "8080"
      ENV: "development"
      DB_DRIVER: "postgres"
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/mariadiezma?sslmode=disable"
      JWT_SECRET: "super-secret-jwt-key-mariadiezma-2026"
      JWT_EXPIRATION_HOURS: "24"
      ADMIN_EMAIL: "admin@mariadiezma.com"
      ADMIN_PASSWORD: "AdminPass123!"
      CORS_ALLOWED_ORIGINS: "*"
      SMTP_HOST: "${SMTP_HOST:-smtp.gmail.com}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-oscardelamo.oda@gmail.com}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: "${SMTP_FROM:-oscardelamo.oda@gmail.com}"
      NOTIFICATION_EMAIL: "${NOTIFICATION_EMAIL:-oscardelamo.oda@gmail.com}"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
